<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏设计作品集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0f1115;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .container { max-width: 720px; width: 100%; }
        .header {
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid #2a2d35;
        }
        .header h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
        .header p { color: #8b8f9a; font-size: 15px; }
        .item {
            display: flex;
            align-items: center;
            padding: 20px 24px;
            background: #181b22;
            border-radius: 12px;
            margin-bottom: 12px;
            text-decoration: none;
            color: #e8e8e8;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .item:hover {
            background: #1f232c;
            border-color: #3a3f4b;
            transform: translateX(4px);
        }
        .item .icon { font-size: 28px; margin-right: 18px; width: 40px; text-align: center; }
        .item .info { flex: 1; }
        .item .info .name { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .item .info .desc { font-size: 13px; color: #8b8f9a; }
        .item .arrow { color: #4a4f5a; font-size: 20px; }
        .footer {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #2a2d35;
            text-align: center;
            color: #5a5f6a;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 我的游戏设计作品集</h1>
            <p>点击下方条目，即可预览或试玩</p>
        </div>

        <!-- 1. 玩法简介 -->
        <a href="./docs/gameplay_intro.pdf" class="item" target="_blank">
            <span class="icon">📄</span>
            <div class="info">
                <div class="name">玩法简介</div>
                <div class="desc">PDF / 在线预览</div>
            </div>
            <span class="arrow">→</span>
        </a>

        <!-- 2. 玩法展示视频 -->
        <a href="./videos/gameplay.mp4" class="item" target="_blank">
            <span class="icon">🎬</span>
            <div class="info">
                <div class="name">玩法展示视频</div>
                <div class="desc">MP4 / 在线播放</div>
            </div>
            <span class="arrow">→</span>
        </a>

        <!-- 3. 核心玩法 Demo -->
        <a href="./demo/" class="item" target="_blank">
            <span class="icon">🕹️</span>
            <div class="info">
                <div class="name">核心玩法 Demo</div>
                <div class="desc">HTML5 / 点击直接试玩</div>
            </div>
            <span class="arrow">→</span>
        </a>

        <div class="footer">
            © 2026 你的名字 · 游戏策划作品集
        </div>
    </div>
</body>
</html>
